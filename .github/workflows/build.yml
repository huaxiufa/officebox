name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - run: mvn -B package -DskipTests

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: officebox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runtime:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: officebox:runtime
      - name: Start container
        run: docker run -d --name officebox-smoke -p 18080:8080 officebox:runtime
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:18080/api/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          docker logs officebox-smoke
          exit 1
      - name: Verify frontend
        run: curl -fsS http://127.0.0.1:18080/ | head -c 1000
      - name: Show container status
        if: always()
        run: docker ps -a --filter name=officebox-smoke
      - name: Show logs on failure
        if: failure()
        run: docker logs officebox-smoke
      - name: Cleanup
        if: always()
        run: docker rm -f officebox-smoke
