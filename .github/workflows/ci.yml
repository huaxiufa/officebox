name: OfficeBox CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build -t officebox:ci .
      - name: Run application container
        run: |
          docker run -d --name officebox-ci -p 8080:8080 officebox:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs officebox-ci
          exit 1
      - name: Smoke test PDF to Word conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          objects = [
              b'<< /Type /Catalog /Pages 2 0 R >>',
              b'<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
              b'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',
              b'<< /Length 150 >>\nstream\nBT /F1 18 Tf 72 720 Td (OfficeBox PDF to Word smoke test) Tj 0 -28 Td (Summary. ) Tj (bullet one) Tj ( bullet two) Tj ET\nendstream',
              b'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',
          ]
          pdf = bytearray(b'%PDF-1.4\n')
          offsets = [0]
          for i, obj in enumerate(objects, 1):
              offsets.append(len(pdf))
              pdf.extend(f'{i} 0 obj\n'.encode())
              pdf.extend(obj)
              pdf.extend(b'\nendobj\n')
          xref = len(pdf)
          pdf.extend(f'xref\n0 {len(objects)+1}\n'.encode())
          pdf.extend(b'0000000000 65535 f \n')
          for off in offsets[1:]:
              pdf.extend(f'{off:010d} 00000 n \n'.encode())
          pdf.extend(f'trailer\n<< /Size {len(objects)+1} /Root 1 0 R >>\nstartxref\n{xref}\n%%EOF\n'.encode())
          Path('/tmp/officebox-smoke.pdf').write_bytes(pdf)
          PY
          curl -fsS -F 'file=@/tmp/officebox-smoke.pdf;type=application/pdf' \
            http://127.0.0.1:8080/api/pdf/to-word -o /tmp/officebox-smoke.docx
          unzip -t /tmp/officebox-smoke.docx
          unzip -p /tmp/officebox-smoke.docx word/document.xml | grep -F 'OfficeBox PDF to Word smoke test'
          python3 - <<'PY'
          from zipfile import ZipFile
          from xml.etree import ElementTree as ET

          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with ZipFile('/tmp/officebox-smoke.docx') as zf:
              root = ET.fromstring(zf.read('word/document.xml'))
          paragraphs = []
          for p in root.findall('.//w:body/w:p', ns):
              text = ''.join(t.text or '' for t in p.findall('.//w:t', ns))
              if text:
                  paragraphs.append(text)
          assert 'OfficeBox PDF to Word smoke test' in paragraphs
          assert 'Summary. bullet one' in paragraphs
          assert 'bullet two' in paragraphs
          print('PDF->Word paragraph smoke test passed:', paragraphs)
          PY
      - name: Stop application container
        if: always()
        run: docker rm -f officebox-ci 2>/dev/null || true
